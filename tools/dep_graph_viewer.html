searchEl.addEventListener("keydown", (e) => { if (e.key === "Enter") pick(hitSel); else if (e.key === "Escape") { resEl.style.display = "none"; searchEl.blur(); } });
resEl.addEventListener("mousedown", (e) => { const t = e.target.closest("[data-i]"); if (t) pick(+t.dataset.i); });

// ---------------------------------------------------------------- mouse
let drag = null, pan = null, moved = false;
const tip = document.getElementById("tip");
canvas.addEventListener("mousedown", (e) => {
  const r = canvas.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top, u = hit(px, py);
  moved = false;
  if (u) { drag = {u, sx: px, sy: py}; u.fx = u.x; u.fy = u.y; wake(0.25); }
  else { pan = {px, py, x: view.x, y: view.y}; canvas.style.cursor = "grabbing"; }
});
window.addEventListener("mousemove", (e) => {
  const r = canvas.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (drag) {
    if (Math.abs(px - drag.sx) + Math.abs(py - drag.sy) > 3) moved = true;
    const w = toWorld(px, py); drag.u.fx = w.x; drag.u.fy = w.y; wake(0.3); dirty = true; return;
  }
  if (pan) { view.x = pan.x + (px - pan.px); view.y = pan.y + (py - pan.py); view.tx = view.x; view.ty = view.y; view.animate = false; moved = true; dirty = true; return; }
  if (px < 0 || py < 0 || px > W || py > H) { tip.style.display = "none"; return; }
  const u = hit(px, py), id = u ? u.id : null;
  if (id !== S.hover) { S.hover = id; dirty = true; }
  canvas.style.cursor = u ? "pointer" : "grab";
  if (u) {
    tip.style.display = "block"; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 10) + "px";
    tip.textContent = u.type === "m" ? mods[u.idx][0] + "/  " + modStats[u.idx].n + " files, " + modStats[u.idx].loc + " LOC" : files[u.idx][F.PATH] + "  (" + files[u.idx][F.LOC] + " LOC)";
  } else tip.style.display = "none";
});
window.addEventListener("mouseup", () => {
  if (drag) {
    const u = drag.u; u.fx = u.fy = null;
    if (!moved) select(u.id);
    drag = null;
  } else if (pan) { pan = null; canvas.style.cursor = "grab"; if (!moved) select(null); }
});
canvas.addEventListener("dblclick", (e) => {
  const r = canvas.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top, u = hit(px, py);
  if (u) { if (u.type === "m") expand(u.idx); else collapseTo(S.expanded.indexOf(u.mod)); return; }
  const w = toWorld(px, py);
  for (const m of S.expanded) { const h = hullOf(m); if (h && Math.hypot(w.x - h.x, w.y - h.y) < h.r) { collapseTo(S.expanded.indexOf(m)); return; } }
});
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const f = Math.exp(-e.deltaY * 0.0015), nk = Math.max(0.04, Math.min(8, view.k * f)), w = toWorld(px, py);
  view.k = nk; view.x = px - w.x * nk; view.y = py - w.y * nk; view.tk = view.k; view.tx = view.x; view.ty = view.y; view.animate = false; dirty = true;
}, {passive: false});
window.addEventListener("resize", () => { resize(); });

// ---------------------------------------------------------------- loop and start
function frame() {
  if (sim.running) { tick(); if (sim.running) tick(); dirty = true; }
  if (view.animate) {
    view.k += (view.tk - view.k) * 0.2; view.x += (view.tx - view.x) * 0.2; view.y += (view.ty - view.y) * 0.2;
    if (Math.abs(view.tk - view.k) < 0.002 && Math.abs(view.tx - view.x) < 0.5 && Math.abs(view.ty - view.y) < 0.5) { view.k = view.tk; view.x = view.tx; view.y = view.ty; view.animate = false; }
    dirty = true;
  }
  if (dirty) draw();
  requestAnimationFrame(frame);
}
function applyHash() {
  const p = new URLSearchParams(location.hash.replace(/^#/, ""));
  for (const k of ["tests", "tools", "addons", "assets"]) if (p.has(k)) S.filters[k] = p.get(k) !== "0";
  for (const k of ["cycles", "unused", "autoload", "viol"]) if (p.has(k)) S.modes[k] = p.get(k) !== "0";
  if (p.get("dynamic")) S.groups[5] = p.get("dynamic") === "0" ? 0 : 1;
  return p;
}
function init() {
  const p = applyHash();
  buildLeft(); resize(); renderCrumbs();
  rebuild(); warm(1);
  const ex = p.get("expand");
  if (ex) {
    for (const name of ex.split(",")) { const m = modIndex.get(name); if (m !== undefined && !S.expanded.includes(m)) S.expanded.push(m); }
    rebuild(); warm(0.8); renderCrumbs();
  }
  fitTo(units, true);
  if (ex && S.expanded.length) {
    const last = S.expanded[S.expanded.length - 1];
    fitTo(units.filter((u) => u.type === "f" && u.mod === last), true, 2.5);
  }
  const sel = p.get("sel");
  if (sel) {
    if (sel.startsWith("mod:")) { const m = modIndex.get(sel.slice(4)); if (m !== undefined) { const u = units[unitOfMod[m]]; if (u) select(u.id); } }
    else { const i = pathIndex.get(sel); if (i !== undefined) { gotoFile(i, true); } }
    if (p.get("zoomsel") && S.sel) { const u = unitById(S.sel); if (u) { view.k = view.tk = 1.6; view.x = view.tx = W / 2 - u.x * 1.6; view.y = view.ty = H / 2 - u.y * 1.6; } }
  }
  renderSide(); draw();
  window.__depgraphReady = true;
  requestAnimationFrame(frame);
}
init();
})();
</script></body></html>
