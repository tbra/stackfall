    else if (u.type === "x") text = baseName(files[u.idx][F.PATH]);
    else text = u.ext ? baseName(files[u.file][F.PATH]) + ":" + fnRows[u.idx][FN.NAME] : fnRows[u.idx][FN.NAME];
    ctx.font = (u.id === S.sel ? "bold " : "") + (px / k) + "px Segoe UI,Arial"; ctx.globalAlpha = sel && !inSel ? 0.25 : 1;
    ctx.lineWidth = 3 / k; ctx.strokeStyle = "#12151c"; ctx.strokeText(text, u.x, u.y + u.r + (px + 2) / k);
    ctx.fillStyle = u.ext ? "#c5cde0" : "#e8ecf6"; ctx.fillText(text, u.x, u.y + u.r + (px + 2) / k);
  }
  ctx.globalAlpha = 1;
}

// ---- function view: side panel
function callList(r, dir) {
  // distinct callers (dir "in") or callees ("out") of function r under the current filters
  const m = new Map(), list = dir === "in" ? cin[r] : cout[r];
  for (const ei of list) {
    const e = ce[ei]; if (!edgeOn(e)) continue;
    const ff = edgeFiles(e), of = dir === "in" ? ff[0] : ff[1]; if (of !== fnFile[r] && !fileVisible(of)) continue;
    const key = dir === "in" ? (e[0] >= 0 ? "n" + e[0] : "t" + of) : "n" + e[1];
    let ent = m.get(key); if (!ent) { ent = {key, kinds: new Set(), amb: true, of}; m.set(key, ent); }
    ent.kinds.add(kindName[e[2]]); if (!e[3]) ent.amb = false;
  }
  return m;
}
function callRows(m, title) {
  const arr = Array.from(m.values()).sort((a, b) => a.amb - b.amb || a.key.localeCompare(b.key, undefined, {numeric: true}));
  let h = "<h4>" + title + " (" + arr.length + ")</h4>";
  if (!arr.length) return h + "<small>none with the current filters</small>";
  for (const ent of arr.slice(0, 40)) {
    const k = Array.from(ent.kinds).join(", "), own = ent.of === FV.file;
    let name, attr, tip;
    if (ent.key[0] === "t") { name = (own ? "" : baseName(files[ent.of][F.PATH]) + " ") + "(top-level code)"; attr = "data-ftop='" + ent.of + "'"; tip = files[ent.of][F.PATH]; }
    else { const r = +ent.key.slice(1); name = (own ? "" : baseName(files[ent.of][F.PATH]) + ":") + fnRows[r][FN.NAME]; attr = "data-fn='" + r + "'"; tip = fnLabel(r); }
    h += "<div class='nb'><a " + attr + " title='" + esc(tip) + "'" + (ent.amb ? " style='opacity:.6'" : "") + ">" + esc(name) + "</a><em title='" + esc(k) + "'>" + esc(k.length > 22 ? k.slice(0, 21) + "..." : k) + "</em></div>";
  }
  if (arr.length > 40) h += "<small>" + (arr.length - 40) + " more not listed</small>";
  return h;
}
function unitRows(u) {
  // collapsed file / top-level node: the nodes it is connected to in the current graph
  const ins = new Set(), outs = new Set();
  for (const i of uin[u.n]) ins.add(units[uedges[i].a].id);
  for (const i of uout[u.n]) outs.add(units[uedges[i].b].id);
  const row = (id) => {
    const o = unitById(id); if (!o) return "";
    if (o.type === "n") return "<div class='nb'><a data-fn='" + o.idx + "'>" + esc((o.ext ? baseName(files[o.file][F.PATH]) + ":" : "") + fnRows[o.idx][FN.NAME]) + "</a></div>";
    if (o.type === "x") return "<div class='nb'><a data-xexpand='" + o.idx + "'>" + esc(baseName(files[o.idx][F.PATH])) + " (collapsed)</a></div>";
    return "<div class='nb'><a data-ftop='" + o.file + "'>(top-level code)</a></div>";
  };
  return "<h4>Calls into it (" + ins.size + ")</h4>" + Array.from(ins).slice(0, 40).map(row).join("") + "<h4>It calls (" + outs.size + ")</h4>" + Array.from(outs).slice(0, 40).map(row).join("");
}
function renderSideFV() {
  const u = S.sel && unitById(S.sel), fi = FV.file, f = files[fi]; let h = "";
  if (!u) {
    h += "<h4>Function view</h4><div style='word-break:break-all;color:#fff;font-size:13px'>" + esc(f[F.PATH]) + "</div><br><div class='kv'>";
    h += "<span>functions</span><span>" + f[F.NF] + "</span><span>LOC</span><span>" + f[F.LOC] + "</span><span>other files</span><span>" + FV.clusters.size + "</span><span>call edges shown</span><span>" + uedges.length + "</span></div><br>";
    h += "<small>Click a function to highlight its callers (blue) and callees (orange); arrows point caller to callee. Double-click a function outside the outline to open its file's function view; double-click a collapsed file box to expand it. Drag nodes, drag the background to pan, wheel to zoom. Back or the breadcrumb returns. Ambiguous (name-only) calls are hidden until ticked on the left.</small>";
    const zero = []; for (let r = fstart[fi]; r < fstart[fi + 1]; r++) if (cin[r].length === 0 || fnRows[r][FN.LIVE] === 3) zero.push(r);
    h += "<h4>No callers / dead in this file (" + zero.length + ")</h4>";
    for (const r of zero.slice(0, 40)) h += "<div class='nb'><a data-fn='" + r + "'>" + esc(fnRows[r][FN.NAME]) + "</a><em>" + (fnRows[r][FN.LIVE] === 3 ? "dead" : "no callers") + "</em></div>";
    sideEl.innerHTML = h; return;
  }
  if (u.type === "x") {
    const g = files[u.idx];
    h += "<h4>Other file (collapsed)</h4><div style='word-break:break-all;color:#fff;font-size:13px'>" + esc(g[F.PATH]) + "</div><br><div class='kv'><span>nodes</span><span>" + u.cnt + "</span><span>functions</span><span>" + g[F.NF] + "</span></div><br>";
    h += "<button data-xexpand='" + u.idx + "'>Expand its functions</button> <button data-xopen='" + u.idx + "'>Open its function view</button>";
    sideEl.innerHTML = h + unitRows(u); return;
  }
  if (u.type === "t") {
    h += "<h4>Top-level code</h4><div style='word-break:break-all;color:#fff;font-size:13px'>" + esc(files[u.file][F.PATH]) + "</div><br><small>Calls made from the file's top level (class body, scene signal connections).</small><br><br>";
    if (u.ext) h += "<button data-xopen='" + u.file + "'>Open its function view</button>";
    sideEl.innerHTML = h + unitRows(u); return;
  }
  const r = u.idx, row = fnRows[r], b = row[FN.FLAGS], tags = [];
  if (b & FB_STATIC) tags.push("<span class='tag'>static</span>"); if (b & FB_RPC) tags.push("<span class='tag gold'>rpc</span>");
  if (b & FB_ENGINE) tags.push("<span class='tag gold'>engine virtual</span>"); if (b & FB_OVERRIDE) tags.push("<span class='tag gold'>override</span>");
  if (b & FB_TEST) tags.push("<span class='tag grey'>test entry</span>"); if (b & FB_CYCLE) tags.push("<span class='tag red'>call cycle</span>");
  h += "<h4>Function</h4><div style='color:#fff;font-size:13px;word-break:break-all'>" + esc(row[FN.NAME]) + "()</div><br><div class='kv'>";
  h += "<span>location</span><span style='word-break:break-all'>" + esc(files[fnFile[r]][F.PATH]) + ":" + row[FN.LINE] + "-" + row[FN.END] + " (" + fnLines(r) + " lines)</span>";
  h += "<span>liveness</span><span>" + esc(LIVE_NOTE[row[FN.LIVE]]) + "</span></div><br>" + (tags.join("") || "<small>no flags</small>");
  if (u.ext) h += "<br><br><button data-xopen='" + u.file + "' data-xfn='" + r + "'>Open this file's function view</button>";
  h += callRows(callList(r, "in"), "Callers") + callRows(callList(r, "out"), "Callees");
  const sg = FVD.fsig[r];
  if (sg) {
    h += "<h4>Signals</h4>";
    for (const s of sg) h += "<div class='nb'><span>" + esc(FVD.sigs[s[0]]) + "</span><em>" + (s[1] ? "connects" : "emits") + "</em></div>";
  }
  if (u.ext && FV.ext.has(u.file)) h += "<br><button data-xcollapse='" + u.file + "'>Collapse " + esc(baseName(files[u.file][F.PATH])) + "</button>";
  sideEl.innerHTML = h;
}

// ---- function view: navigation
function openFV(fi, selFn, push) {
  ensureVisible(fi);   // turns on the tests/tools/addons filter when the file lives there
  if (!FV) FV = {saved: {units, uedges, uout, uin, sel: S.sel, view: Object.assign({}, view)}, hist: [], ext: new Set(), pos: new Map(), clusters: new Map(), collapsed: new Set()};
  if (push !== false && FV.hist[FV.hist.length - 1] !== fi) FV.hist.push(fi);
  FV.file = fi; FV.ext = new Set(); FV.pos = new Map(); units = []; S.sel = null; S.hover = null; sim.alpha = 0;
  rebuildFV(); buildLeft(); renderCrumbs(); warm(1); fitTo(units, true);
  if (selFn !== undefined) selectUnit("n" + selFn, true);
  renderSide(); dirty = true;
}
function exitFV() {
  if (!FV) return;
  const sv = FV.saved; FV = null;
  units = sv.units; uedges = sv.uedges; uout = sv.uout; uin = sv.uin; S.sel = sv.sel; S.hover = null;
  Object.assign(view, sv.view); view.animate = false; sim.alpha = 0; sim.running = false;
  rebuild(); buildLeft(); renderCrumbs(); renderSide(); dirty = true;
}
function backFV() {
  if (!FV) return;
  if (FV.hist.length > 1) { FV.hist.pop(); openFV(FV.hist[FV.hist.length - 1], undefined, false); } else exitFV();
}
function selectUnit(id, center) { const u = unitById(id); if (!u) return; select(id); if (center) centerOn(u, Math.max(view.k, 1.3)); }
function gotoFnView(r) { const f = fnFile[r]; if (f === FV.file) selectUnit("n" + r, true); else openFV(f, r); }
function refreshFV(alpha) { rebuildFV(); warm(alpha); renderSide(); }

// ---- function view: left panel
function buildLeftFV() {
  let h = "<h4>Show callers/callees in</h4>";
  h += "<label><input type='checkbox' data-f='tests'> tests/</label><label><input type='checkbox' data-f='tools'> tools/ &amp; source_art/</label><label><input type='checkbox' data-f='addons'> addons/</label>";
  h += "<h4>Call kinds</h4>";
  kindName.forEach((k, i) => { h += "<label title='" + esc(KIND_NOTE[k] || k) + "'><input type='checkbox' data-k='" + i + "'><i class='ln' style='background:" + (KIND_COL[k] || "#aaa") + "'></i>" + esc(k) + "</label>"; });
  h += "<small>ambiguous = name-only guesses; drawn dashed and faint when on</small>";
  h += "<h4>Function colour</h4>";
  h += "<div class='leg'><i style='background:#4fc3f7'></i>static</div><div class='leg'><i style='background:#7bd88f'></i>rpc</div><div class='leg'><i style='background:#ffd54f'></i>engine virtual / override</div>";
  h += "<div class='leg'><i style='background:" + COL_PLAIN + "'></i>other function</div><div class='leg'><i class='sq' style='background:" + COL_TOP + ";transform:rotate(45deg) scale(.8)'></i>top-level code</div>";
  h += "<h4>Liveness</h4><div class='leg'><i style='background:" + COL_GREY + ";box-shadow:0 0 0 2px " + COL_DEAD + "'></i>dead</div>";
  h += "<div class='leg'><i style='background:#5d6779'></i>only tests/tools call it</div><div class='leg'><i style='background:none;border:2px solid #9aa3b8'></i>no callers at all</div>";
  h += "<div class='leg'><i style='background:" + shade(COL_PLAIN, 0.7) + "'></i>only ambiguous guesses reach it</div>";
  h += "<h4>Selection</h4><div class='leg'><i style='background:" + COL_IN + "'></i>callers (call it)</div><div class='leg'><i style='background:" + COL_OUT + "'></i>callees (it calls)</div>";
  h += "<div class='leg'>size = lines of the function; dashed groups = other files; square = collapsed file</div>";
  leftEl.innerHTML = h; syncFilterBoxes();
}

// ---- function view: search
const fnLower = fnRows.map((r) => r[FN.NAME].toLowerCase());
function fnSearchHits(q) {
  const out = [];
  for (let r = 0; r < fnRows.length; r++) {
    const s = fnLower[r], at = s.indexOf(q); if (at < 0) continue;
    out.push({fn: r, sc: (fnFile[r] === FV.file ? 0 : 4) + (s === q ? 0 : at === 0 ? 1 : 2)});
  }
  out.sort((a, b) => a.sc - b.sc || a.fn - b.fn);
  return out.slice(0, 40).map((h) => ({fn: h.fn, t: fnRows[h.fn][FN.NAME] + "   " + files[fnFile[h.fn]][F.PATH] + ":" + fnRows[h.fn][FN.LINE]}));
}

// ---------------------------------------------------------------- loop and start
function frame() {
  if (sim.running) { tick(); if (sim.running) tick(); dirty = true; }
  if (view.animate) {
    view.k += (view.tk - view.k) * 0.2; view.x += (view.tx - view.x) * 0.2; view.y += (view.ty - view.y) * 0.2;
    if (Math.abs(view.tk - view.k) < 0.002 && Math.abs(view.tx - view.x) < 0.5 && Math.abs(view.ty - view.y) < 0.5) { view.k = view.tk; view.x = view.tx; view.y = view.ty; view.animate = false; }
    dirty = true;
  }
  if (dirty) draw();
  requestAnimationFrame(frame);
}
function applyHash() {
  const p = new URLSearchParams(location.hash.replace(/^#/, ""));
  for (const k of ["tests", "tools", "addons", "assets"]) if (p.has(k)) S.filters[k] = p.get(k) !== "0";
  for (const k of ["cycles", "unused", "autoload", "viol"]) if (p.has(k)) S.modes[k] = p.get(k) !== "0";
  if (p.get("dynamic")) S.groups[5] = p.get("dynamic") === "0" ? 0 : 1;
  return p;
}
function init() {
  const p = applyHash();
  buildLeft(); resize(); renderCrumbs();
  rebuild(); warm(1);
  const ex = p.get("expand");
  if (ex) {
    for (const name of ex.split(",")) { const m = modIndex.get(name); if (m !== undefined && !S.expanded.includes(m)) S.expanded.push(m); }
    rebuild(); warm(0.8); renderCrumbs();
  }
  fitTo(units, true);
  if (ex && S.expanded.length) {
    const last = S.expanded[S.expanded.length - 1];
    fitTo(units.filter((u) => u.type === "f" && u.mod === last), true, 2.5);
  }
  const sel = p.get("sel");
  if (sel) {
    if (sel.startsWith("mod:")) { const m = modIndex.get(sel.slice(4)); if (m !== undefined) { const u = units[unitOfMod[m]]; if (u) select(u.id); } }
    else { const i = pathIndex.get(sel); if (i !== undefined) { gotoFile(i, true); } }
    if (p.get("zoomsel") && S.sel) { const u = unitById(S.sel); if (u) { view.k = view.tk = 1.6; view.x = view.tx = W / 2 - u.x * 1.6; view.y = view.ty = H / 2 - u.y * 1.6; } }
  }
  const fp = p.get("funcs");
  if (fp) {
    const fi = pathIndex.get(fp);
    if (fi !== undefined) {
      if (p.get("amb") === "1") S.kinds[AMB_K] = true;
      openFV(fi);
      if (p.get("fext")) { for (const q of p.get("fext").split(",")) { const e = pathIndex.get(q); if (e !== undefined) FV.ext.add(e); } refreshFV(0.8); fitTo(units, true); }
      const fs = p.get("fsel");
      if (fs) { for (let r = fstart[fi]; r < fstart[fi + 1]; r++) if (fnRows[r][FN.NAME] === fs) { selectUnit("n" + r, false); break; } }
      if (p.get("fx")) { const x = FV.clusters.get(pathIndex.get(p.get("fx"))); if (x && x.length) selectUnit(x[0].id, false); }
    }
  }
  renderSide(); draw();
  window.__depgraphReady = true;
  requestAnimationFrame(frame);
}
init();
})();
</script></body></html>
